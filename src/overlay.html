<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>clocki</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    /* Cyber Themes */
    :root {
      --bg: #0c0a03;
      --border-accent: #ffb400;
      --text-glow: #ffc800;
      --text-dim: #7a5800;
      --shadow-glow: rgba(255, 180, 0, 0.45);
      --scanline: rgba(255, 180, 0, 0.07);
    }

    body.theme-cyan {
      --bg: #000a0e;
      --border-accent: #00ffe0;
      --text-glow: #00ffe0;
      --text-dim: #007a6b;
      --shadow-glow: rgba(0, 255, 224, 0.45);
      --scanline: rgba(0, 255, 224, 0.07);
    }

    body.theme-red {
      --bg: #0e0202;
      --border-accent: #ff2a2a;
      --text-glow: #ff4444;
      --text-dim: #7a1414;
      --shadow-glow: rgba(255, 42, 42, 0.45);
      --scanline: rgba(255, 42, 42, 0.07);
    }

    body.theme-purple {
      --bg: #09030e;
      --border-accent: #bf00ff;
      --text-glow: #d440ff;
      --text-dim: #5c007a;
      --shadow-glow: rgba(191, 0, 255, 0.45);
      --scanline: rgba(191, 0, 255, 0.07);
    }

    body.theme-bw {
      --bg: #050505;
      --border-accent: #ffffff;
      --text-glow: #ffffff;
      --text-dim: #666666;
      --shadow-glow: rgba(255, 255, 255, 0.35);
      --scanline: rgba(255, 255, 255, 0.05);
    }

    .container {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border: 1px solid var(--border-accent);
      clip-path: polygon(
        12px 0, calc(100% - 12px) 0, 
        100% 12px, 100% calc(50% - 6px),
        calc(100% - 3px) 50%, 100% calc(50% + 6px),
        100% calc(100% - 12px), calc(100% - 12px) 100%, 
        12px 100%, 0 calc(100% - 12px),
        0 calc(50% + 6px), 3px 50%, 0 calc(50% - 6px),
        0 12px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
      padding: 2px 6px;
    }

    .container.running {
      border-color: var(--border-accent);
      box-shadow: 0 0 14px var(--shadow-glow), inset 0 0 16px var(--shadow-glow);
    }

    .container.paused {
      border-color: var(--text-dim);
      opacity: 0.88;
    }

    /* Inner Bevel Border & Cyber Armor Panels */
    .inner-frame {
      position: absolute;
      inset: 2px;
      border: 1px solid var(--border-accent);
      opacity: 0.5;
      clip-path: polygon(
        10px 0, calc(100% - 10px) 0, 
        100% 10px, 100% calc(100% - 10px), 
        calc(100% - 10px) 100%, 10px 100%, 
        0 calc(100% - 10px), 0 10px
      );
      pointer-events: none;
    }

    /* Status dot indicator */
    .status-dot {
      position: absolute;
      top: 4px;
      right: 8px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--border-accent);
      box-shadow: 0 0 6px var(--text-glow);
      display: none;
    }


    body.large-view .status-dot {
      display: block;
    }

    .time {
      font-family: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
      font-size: clamp(10px, 42vh, 48px);
      font-weight: 700;
      color: var(--text-glow);
      letter-spacing: 1px;
      text-shadow: 0 0 6px var(--shadow-glow), 0 0 14px var(--shadow-glow);
      line-height: 1;
      white-space: nowrap;
    }

    .paused .time {
      color: var(--text-dim);
      text-shadow: none;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* Scanlines effect */
    .scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        var(--scanline) 2px, var(--scanline) 4px
      );
      pointer-events: none;
    }
  </style>
</head>
<body class="theme-cyan">
  <div class="container paused" id="container">
    <div class="inner-frame"></div>
    <div class="scanline"></div>
    <span class="time" id="time">0.00h</span>
  </div>


  <script>
    const container = document.getElementById('container');
    const timeEl = document.getElementById('time');

    let running = false;
    let baseTotalMs = 0;
    let sessionStart = null;
    let ticker = null;
    let currentMode = 'timer';

    function formatHours(ms) {
      return (ms / 3_600_000).toFixed(2) + 'h';
    }

    function formatRealTimeClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function renderTime() {
      if (currentMode === 'clock' && document.body.classList.contains('large-view')) {
        timeEl.textContent = formatRealTimeClock();
      } else {
        const live = sessionStart !== null ? Date.now() - sessionStart : 0;
        timeEl.textContent = formatHours(baseTotalMs + live);
      }
    }

    function restartTicker() {
      if (ticker !== null) clearInterval(ticker);
      ticker = setInterval(renderTime, 1000);
    }

    function checkSizeClass() {
      if (window.innerWidth > 120) {
        document.body.classList.add('large-view');
      } else {
        document.body.classList.remove('large-view');
      }
    }

    window.addEventListener('resize', () => {
      checkSizeClass();
      renderTime();
    });

    window.clocki.onStateUpdate((data) => {
      running = data.running;
      baseTotalMs = data.totalMs;
      currentMode = data.mode || 'timer';
      sessionStart = running ? Date.now() : null;
      document.body.className = 'theme-' + (data.theme || 'deusex');
      checkSizeClass();
      container.className = 'container ' + (running ? 'running' : 'paused');
      renderTime();
      restartTicker();
    });

    let mouseDownAt = null;
    let startX = 0;
    let startY = 0;
    let hasDragged = false;

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.clocki.openContextMenu();
    });

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      mouseDownAt = Date.now();
      startX = e.screenX;
      startY = e.screenY;
      hasDragged = false;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (mouseDownAt === null) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      if (!hasDragged && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      hasDragged = true;
      window.clocki.dragMove(dx, dy);
      startX = e.screenX;
      startY = e.screenY;
    });

    let clickTimer = null;

    document.addEventListener('mouseup', (e) => {
      if (e.button !== 0 || mouseDownAt === null) return;

      if (hasDragged) {
        window.clocki.dragEnd();
      } else if (clickTimer === null) {
        clickTimer = setTimeout(() => {
          window.clocki.toggle();
          clickTimer = null;
        }, 250);
      }

      mouseDownAt = null;
    });

    document.addEventListener('dblclick', () => {
      if (clickTimer !== null) {
        clearTimeout(clickTimer);
        clickTimer = null;
      }
      window.clocki.reset();
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r') {
        e.preventDefault();
        window.clocki.reset();
      }
    });

    window.clocki.requestState();
    setInterval(() => window.clocki.requestState(), 60_000);
  </script>
</body>
</html>
